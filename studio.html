<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script>!function(){try{var d=JSON.parse(localStorage.getItem('todo_settings')||'{}'),t=d.theme||'light';if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.className='theme-'+t;var dk=['dark','forest','night','torii','purple','ferriswheel','starrynight'];document.documentElement.style.background=dk.indexOf(t)>=0?'#0d1117':'#f0f4ff';}catch(e){}}();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>琉璃工坊 — Studio</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">

    <link rel="stylesheet" href="./css/shared_theme.css">
    <link rel="stylesheet" href="./css/effects.css">
    <link rel="stylesheet" href="./css/lapis_shared_style.css">
    <link rel="stylesheet" href="./css/lapis_scroll.css">

    <script src="./js/effects.js" defer></script>
    <script src="./js/storage.js" defer></script>
    <script src="./js/core_engine.js" defer></script>
    <script src="./js/nav.js" defer></script>
    <script src="./js/lapis_core_ui.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js" defer></script>
    <script src="./js/lapis_studio_engine.js" defer></script>

    <style>
        [v-cloak] { display: none !important; }
        html  { background: #0d0d0d; }
        body  { opacity: 0; transition: opacity 0.4s ease-in-out; }
        body.lapis-ready { opacity: 1; }

        /* Horizontal nav-swap: new nav slides in from right, old exits to left */
        .nav-swap-enter-active,
        .nav-swap-leave-active { transition: transform 0.26s cubic-bezier(0.4,0,0.2,1), opacity 0.26s ease; }
        .nav-swap-enter-from   { transform: translateX(100%); opacity: 0; }
        .nav-swap-leave-to     { transform: translateX(-100%); opacity: 0; }

        /* Upload drop zone */
        .studio-drop-zone { border: 2px dashed rgba(255,255,255,0.18); transition: border-color 0.2s; }
        .studio-drop-zone.drag-over { border-color: #3b82f6; }
        body.theme-light .studio-drop-zone,  body.theme-cherry .studio-drop-zone,
        body.theme-sky   .studio-drop-zone,  body.theme-seaside .studio-drop-zone,
        body.theme-sunset .studio-drop-zone, body.theme-mapleavenue .studio-drop-zone,
        body.theme-waterfall .studio-drop-zone { border-color: rgba(0,0,0,0.14); }

        /* Shape selector button active state */
        .shape-btn.is-active { background: #3b82f6 !important; color: #fff !important; }

        /* Undo button: disabled style */
        .nav-item[disabled] { opacity: 0.3; pointer-events: none; }

        /* Crop wrap must not clip the SVG overlay */
        #crop-wrap { min-height: 0; position: relative; }
        #crop-wrap .cropper-container { display: block; }
    </style>
</head>
<body>
<div id="lapis-bg-system">
    <div id="bg-layer-a" class="lapis-bg-layer active"></div>
    <div id="bg-layer-b" class="lapis-bg-layer"></div>
</div>

<div id="app" v-cloak
     :class="[isDarkTheme ? 'theme-dark-mode' : 'theme-light-mode']"
     style="display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative;">

    <!-- ROW 1: LapisNav header injected here -->

    <!-- ── Main content ───────────────────────────────────────────────────── -->
    <main class="relative z-10 flex-1 overflow-hidden flex flex-col"
          style="padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px))">

        <!-- A: Upload zone (no image) -->
        <div v-show="contentView === 'upload'"
             class="studio-drop-zone flex-1 flex flex-col items-center justify-center gap-6 m-4 rounded-[2.5rem]"
             :class="{ 'drag-over': dragOver }"
             @dragover.prevent="dragOver = true"
             @dragleave="dragOver = false"
             @drop.prevent="onDrop">
            <i data-lucide="image-plus" class="w-16 h-16 opacity-30"></i>
            <div class="text-center space-y-1">
                <p class="font-black text-lg opacity-70">{{ t.tapToUpload }}</p>
                <p class="text-xs opacity-40">{{ t.uploadHint }}</p>
            </div>
            <label class="px-8 py-4 bg-blue-600 text-white rounded-2xl font-black cursor-pointer active:scale-95 transition-transform select-none">
                {{ t.choosePhoto }}
                <input type="file" accept="image/*" class="hidden" @change="handleFileInput">
            </label>
        </div>

        <!-- B: Image preview -->
        <div v-show="contentView === 'preview'"
             class="flex-1 flex items-center justify-center p-4 overflow-hidden">
            <img :src="resultUrl || imageUrl"
                 class="max-w-full max-h-full object-contain rounded-2xl shadow-2xl"
                 style="pointer-events:none;user-select:none;">
        </div>

        <!-- C: Crop workspace — image at top (flex-1), shape selector at bottom (shrink-0) -->
        <div v-show="contentView === 'crop'" class="flex-1 flex flex-col overflow-hidden min-h-0">

            <!-- Cropper.js container + shape overlay -->
            <div id="crop-wrap" class="flex-1 overflow-hidden">
                <img id="crop-image" style="max-width:100%;display:block;">
                <!-- Shape-aware overlay: dims area OUTSIDE the selected shape -->
                <div v-if="isSpecialShape && cropBoxData && containerSize.w"
                     style="position:absolute;inset:0;pointer-events:none;z-index:20;"
                     v-html="shapeOverlaySvg">
                </div>
            </div>

            <!-- Shape / ratio selector (between image and nav) -->
            <div class="shrink-0 overflow-x-auto no-scrollbar px-3 py-2 flex items-center gap-2"
                 style="border-top:1px solid rgba(255,255,255,0.08)">
                <!-- Standard ratios -->
                <button v-for="r in cropRatios" :key="r.key"
                        @click="setRatio(r)"
                        class="shape-btn shrink-0 px-4 py-2 rounded-full glass text-xs font-bold whitespace-nowrap transition-all"
                        :class="{ 'is-active': cropShape === r.key }"
                        :style="cropShape !== r.key ? glassStyle : {}">
                    {{ r.label }}
                </button>
                <!-- Divider -->
                <div class="shrink-0 w-px h-5 mx-1 opacity-20"
                     :class="isDarkTheme ? 'bg-white' : 'bg-black'"></div>
                <!-- Special shape masks -->
                <button v-for="s in specialShapes" :key="s.key"
                        @click="setSpecialShape(s)"
                        class="shape-btn shrink-0 w-10 h-10 rounded-full glass flex items-center justify-center transition-all"
                        :class="{ 'is-active': cropShape === s.key }"
                        :style="cropShape !== s.key ? glassStyle : {}"
                        :title="t[s.key]"
                        v-html="s.svg">
                </button>
            </div>
        </div>

        <!-- D: Effects placeholder -->
        <div v-show="contentView === 'effects'"
             class="flex-1 flex items-center justify-center p-8">
            <div class="glass rounded-[2.5rem] p-10 flex flex-col items-center gap-4 max-w-sm w-full" :style="glassStyle">
                <i data-lucide="sparkles" class="w-12 h-12 opacity-40"></i>
                <h2 class="text-xl font-black tracking-tight">{{ t.effects }}</h2>
                <p class="text-sm opacity-40 text-center">{{ t.comingSoon }}</p>
            </div>
        </div>

    </main>

    <!-- ── Bottom Nav: main ───────────────────────────────────────────────── -->
    <transition name="nav-swap" mode="out-in">
        <nav v-if="activeNav === 'main'" key="nav-main"
             class="bottom-nav glass" :style="glassStyle">
            <button @click="triggerUpload" class="nav-item" :class="{ active: !imageUrl }">
                <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                <span>{{ t.upload }}</span>
            </button>
            <button @click="enterCrop" class="nav-item"
                    :style="!imageUrl ? { opacity: 0.35, pointerEvents: 'none' } : {}">
                <i data-lucide="crop" class="w-5 h-5"></i>
                <span>{{ t.crop }}</span>
            </button>
            <button @click="toggleEffects" class="nav-item" :class="{ active: currentTab === 'effects' }">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
                <span>{{ t.effects }}</span>
            </button>
            <button @click="promptDownload" class="nav-item"
                    :style="!imageUrl ? { opacity: 0.35, pointerEvents: 'none' } : {}">
                <i data-lucide="download" class="w-5 h-5"></i>
                <span>{{ t.save }}</span>
            </button>
        </nav>

        <!-- ── Bottom Nav: crop tool (4-button action row) ────────────────── -->
        <nav v-else key="nav-crop"
             class="bottom-nav glass" style="backdrop-filter:blur(24px);" :style="glassStyle">
            <!-- 返回: exit crop without applying -->
            <button @click="exitCrop" class="nav-item">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                <span>{{ t.back }}</span>
            </button>
            <!-- 復原: undo last apply -->
            <button @click="undo" class="nav-item" :disabled="canUndoCt === 0">
                <i data-lucide="undo-2" class="w-5 h-5"></i>
                <span>{{ t.undo }}</span>
            </button>
            <!-- 套用: apply crop → update preview, push history, stay for more edits -->
            <button @click="confirmCrop" class="nav-item active">
                <i data-lucide="check" class="w-5 h-5"></i>
                <span>{{ t.apply }}</span>
            </button>
            <!-- 保存: apply crop (if any) + trigger download -->
            <button @click="saveFromCrop" class="nav-item">
                <i data-lucide="download" class="w-5 h-5"></i>
                <span>{{ t.save }}</span>
            </button>
        </nav>
    </transition>

    <!-- Hidden file input -->
    <input id="studio-file-input" type="file" accept="image/*" class="hidden" @change="handleFileInput">

    <!-- Filename modal (LV2 bottom-sheet) -->
    <transition name="fade">
        <div v-show="showFilenameModal"
             class="fixed inset-0 flex items-end justify-center bg-black/60 backdrop-blur-sm"
             style="z-index:var(--z-modal-lv2-backdrop)"
             @click.self="showFilenameModal = false">
            <div class="glass rounded-t-[2.5rem] w-full max-w-md p-6 pb-10 space-y-4"
                 :style="glassStyle" @click.stop>
                <h3 class="font-black text-lg">{{ t.saveAs }}</h3>
                <input v-model="downloadFilename" type="text"
                       class="w-full glass rounded-2xl px-4 py-3 font-bold text-sm outline-none"
                       :style="glassStyle"
                       @keyup.enter="doDownload">
                <div class="flex gap-3">
                    <button @click="showFilenameModal = false"
                            class="flex-1 py-3 rounded-xl glass text-sm font-bold">{{ t.cancel }}</button>
                    <button @click="doDownload"
                            class="flex-1 py-3 rounded-xl bg-blue-600 text-white text-sm font-black">{{ t.save }}</button>
                </div>
            </div>
        </div>
    </transition>

</div>

<script defer>
(function waitForVue() {
    if (typeof Vue === 'undefined'               || typeof useNav === 'undefined' ||
        typeof LapisStudioEngine === 'undefined'  || typeof Cropper === 'undefined') {
        return setTimeout(waitForVue, 20);
    }
    const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;

    createApp({
        setup() {
            const { navSettings, isDarkTheme, glassStyle, themeClasses,
                    customBgStyle, systemDark, resolvedTheme } = useNav();

            // ── Core state ───────────────────────────────────────────────────
            const imageUrl          = ref('');       // blob URL (original upload)
            const resultUrl         = ref('');       // data URL (after crop/effect)
            const activeNav         = ref('main');   // 'main' | 'crop'
            const currentTab        = ref('preview');// 'preview' | 'effects'
            const dragOver          = ref(false);
            const cropShape         = ref('free');
            const showFilenameModal = ref(false);
            const downloadFilename  = ref('');

            // Crop overlay state
            const cropBoxData   = ref(null);  // {left,top,width,height} from Cropper.js
            const containerSize = ref({ w: 0, h: 0 }); // #crop-wrap dimensions

            // History
            const canUndoCt = ref(0);    // reactive count, drives Undo button state
            let _undoStack  = [];        // string[] of data URLs (max 10)
            let _cropper    = null;
            let _resultCanvas = null;

            // Drives content panel visibility
            const contentView = computed(() => {
                if (activeNav.value === 'crop') return 'crop';
                if (!imageUrl.value)            return 'upload';
                return currentTab.value;
            });

            const isSpecialShape = computed(() =>
                ['circle', 'ellipse', 'heart', 'star'].includes(cropShape.value)
            );

            // ── Shape-aware crop overlay SVG ──────────────────────────────────
            // Uses SVG mask: white rect (show all) punched with black shape (hide = transparent).
            // Applied to a dark rect → area OUTSIDE the shape is dimmed.
            const shapeOverlaySvg = computed(() => {
                if (!isSpecialShape.value || !cropBoxData.value || !containerSize.value.w) return '';
                const { left: bx, top: by, width: bw, height: bh } = cropBoxData.value;
                const { w: cw, h: ch } = containerSize.value;
                const inner = LapisStudioEngine.svgShapeInner(cropShape.value, bx, by, bw, bh);
                if (!inner) return '';
                return `<svg xmlns="http://www.w3.org/2000/svg" `
                     + `style="width:100%;height:100%;display:block;" `
                     + `viewBox="0 0 ${cw} ${ch}">`
                     + `<defs><mask id="csm-${cropShape.value}">`
                     + `<rect width="${cw}" height="${ch}" fill="white"/>`
                     + inner
                     + `</mask></defs>`
                     + `<rect width="${cw}" height="${ch}" fill="rgba(0,0,0,0.52)" `
                     + `mask="url(#csm-${cropShape.value})"/>`
                     + `</svg>`;
            });

            // ── i18n ─────────────────────────────────────────────────────────
            const translations = {
                zh: {
                    upload: '上傳', crop: '剪裁', effects: '特效', save: '保存',
                    back: '返回', undo: '復原', apply: '套用',
                    tapToUpload: '點擊或拖曳圖片至此',
                    uploadHint: '支援 JPG、PNG、WebP，最大 10 MB',
                    choosePhoto: '選擇照片', comingSoon: '即將推出',
                    saveAs: '另存為', cancel: '取消',
                    free: '自由', '1:1': '1:1', '4:3': '4:3', '9:16': '9:16',
                    circle: '圓形', ellipse: '橢圓', heart: '愛心', star: '星形',
                    errSize: '圖片超過 10 MB，請選擇較小的檔案。',
                    errLoad: '圖片載入失敗，請重試。',
                    noImage: '請先上傳一張圖片。',
                },
                en: {
                    upload: 'Upload', crop: 'Crop', effects: 'Effects', save: 'Save',
                    back: 'Back', undo: 'Undo', apply: 'Apply',
                    tapToUpload: 'Tap or drag an image here',
                    uploadHint: 'JPG, PNG, WebP — max 10 MB',
                    choosePhoto: 'Choose Photo', comingSoon: 'Coming Soon',
                    saveAs: 'Save As', cancel: 'Cancel',
                    free: 'Free', '1:1': '1:1', '4:3': '4:3', '9:16': '9:16',
                    circle: 'Circle', ellipse: 'Ellipse', heart: 'Heart', star: 'Star',
                    errSize: 'Image exceeds 10 MB.',
                    errLoad: 'Failed to load image.',
                    noImage: 'Please upload an image first.',
                },
            };
            const t = computed(() => translations[navSettings.lang] || translations.zh);

            // ── Crop config ───────────────────────────────────────────────────
            const cropRatios = computed(() => [
                { key: 'free', label: t.value.free,    ratio: NaN  },
                { key: '1:1',  label: t.value['1:1'],  ratio: 1    },
                { key: '4:3',  label: t.value['4:3'],  ratio: 4/3  },
                { key: '9:16', label: t.value['9:16'], ratio: 9/16 },
            ]);

            const specialShapes = [
                { key: 'circle',  svg: '<svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor"><circle cx="10" cy="10" r="9"/></svg>' },
                { key: 'ellipse', svg: '<svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor"><ellipse cx="10" cy="10" rx="9" ry="5.5"/></svg>' },
                { key: 'heart',   svg: '<svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor"><path d="M10 17C10 17 3 12 3 7.5a4.5 4.5 0 0 1 7-3.73A4.5 4.5 0 0 1 17 7.5C17 12 10 17 10 17z"/></svg>' },
                { key: 'star',    svg: '<svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor"><polygon points="10,1 12.9,7 19.5,7.6 14.5,12 16.2,18.5 10,15 3.8,18.5 5.5,12 0.5,7.6 7.1,7"/></svg>' },
            ];

            // ── File upload ───────────────────────────────────────────────────
            async function _loadFile(file) {
                if (!file || !file.type.startsWith('image/')) return;
                try {
                    const url = await LapisStudioEngine.load(file);
                    if (imageUrl.value) URL.revokeObjectURL(imageUrl.value);
                    imageUrl.value    = url;
                    resultUrl.value   = '';
                    _resultCanvas     = null;
                    _undoStack        = [];
                    canUndoCt.value   = 0;
                    currentTab.value  = 'preview';
                    activeNav.value   = 'main';
                } catch (e) {
                    alert(e.message === 'SIZE_EXCEEDED' ? t.value.errSize : t.value.errLoad);
                }
            }

            function handleFileInput(e) { _loadFile(e.target.files[0]); e.target.value = ''; }
            function triggerUpload()     { document.getElementById('studio-file-input').click(); }
            function onDrop(e)           { dragOver.value = false; _loadFile(e.dataTransfer.files[0]); }

            // ── Effects tab ───────────────────────────────────────────────────
            function toggleEffects() {
                currentTab.value = currentTab.value === 'effects' ? 'preview' : 'effects';
            }

            // ── History management ────────────────────────────────────────────
            function _pushHistory() {
                _undoStack.push(resultUrl.value);   // '' = original state
                if (_undoStack.length > 10) _undoStack.shift();
                canUndoCt.value = _undoStack.length;
            }

            function undo() {
                if (_undoStack.length === 0) return;
                resultUrl.value = _undoStack.pop();  // '' restores to original
                _resultCanvas   = null;
                canUndoCt.value = _undoStack.length;
                if (activeNav.value === 'crop') {
                    if (_cropper) { _cropper.destroy(); _cropper = null; }
                    cropBoxData.value = null;
                    activeNav.value   = 'main';
                }
                currentTab.value = 'preview';
            }

            // ── Crop ─────────────────────────────────────────────────────────
            async function enterCrop() {
                if (!imageUrl.value) { alert(t.value.noImage); return; }
                cropShape.value   = 'free';
                cropBoxData.value = null;
                activeNav.value   = 'crop';
                await nextTick();
                _initCropper(NaN);
            }

            function _syncContainerSize() {
                const wrap = document.getElementById('crop-wrap');
                if (wrap) containerSize.value = { w: wrap.offsetWidth, h: wrap.offsetHeight };
            }

            function _initCropper(aspectRatio) {
                if (_cropper) { _cropper.destroy(); _cropper = null; }
                const img = document.getElementById('crop-image');
                img.src = resultUrl.value || imageUrl.value;
                _cropper = new Cropper(img, {
                    aspectRatio,
                    viewMode: 1,
                    autoCropArea: 0.85,
                    background: false,
                    movable: true,
                    zoomable: true,
                    ready() {
                        _syncContainerSize();
                        if (_cropper) cropBoxData.value = _cropper.getCropBoxData();
                    },
                    crop() {
                        _syncContainerSize();
                        if (_cropper) cropBoxData.value = _cropper.getCropBoxData();
                    },
                });
            }

            function setRatio(r) {
                cropShape.value = r.key;
                if (_cropper) _cropper.setAspectRatio(r.ratio);
            }

            function setSpecialShape(s) {
                cropShape.value = s.key;
                if (_cropper) _cropper.setAspectRatio(1);  // square base for all masks
            }

            // Apply: crop + push history + exit to preview (re-enter crop for more edits)
            function confirmCrop() {
                if (!_cropper) return;
                _pushHistory();
                const raw      = _cropper.getCroppedCanvas({ imageSmoothingQuality: 'high' });
                const specials = ['circle', 'ellipse', 'heart', 'star'];
                const output   = specials.includes(cropShape.value)
                    ? LapisStudioEngine.applyMask(raw, cropShape.value) : raw;
                _resultCanvas   = output;
                resultUrl.value = output.toDataURL('image/png');
                _cropper.destroy(); _cropper = null;
                cropBoxData.value = null;
                activeNav.value   = 'main';
                currentTab.value  = 'preview';
            }

            function exitCrop() {
                if (_cropper) { _cropper.destroy(); _cropper = null; }
                cropBoxData.value = null;
                activeNav.value   = 'main';
            }

            // Save from crop: apply current crop + open download modal
            async function saveFromCrop() {
                confirmCrop();
                await nextTick();
                promptDownload();
            }

            // ── Download ─────────────────────────────────────────────────────
            function promptDownload() {
                if (!imageUrl.value) { alert(t.value.noImage); return; }
                downloadFilename.value  = `glassystudio_${Date.now()}`;
                showFilenameModal.value = true;
            }

            function doDownload() {
                showFilenameModal.value = false;
                if (_resultCanvas) {
                    LapisStudioEngine.download(_resultCanvas, downloadFilename.value);
                    return;
                }
                // No canvas cached: draw from data URL (after undo) or original blob URL
                const src = resultUrl.value || imageUrl.value;
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = img.naturalWidth; c.height = img.naturalHeight;
                    c.getContext('2d').drawImage(img, 0, 0);
                    LapisStudioEngine.download(c, downloadFilename.value);
                };
                img.src = src;
            }

            // ── Lifecycle ─────────────────────────────────────────────────────
            onMounted(() => {
                if (typeof LapisNav !== 'undefined') LapisNav.inject({ bottom: false });
                if (window.lucide) lucide.createIcons();
            });
            onUnmounted(() => {
                if (_cropper)       _cropper.destroy();
                if (imageUrl.value) URL.revokeObjectURL(imageUrl.value);
            });

            return {
                navSettings, isDarkTheme, glassStyle, themeClasses,
                customBgStyle, systemDark, resolvedTheme,
                imageUrl, resultUrl, activeNav, currentTab, contentView,
                dragOver, cropShape, cropBoxData, containerSize,
                isSpecialShape, shapeOverlaySvg,
                canUndoCt, showFilenameModal, downloadFilename,
                t, cropRatios, specialShapes,
                handleFileInput, triggerUpload, onDrop, toggleEffects,
                enterCrop, exitCrop, confirmCrop, saveFromCrop,
                setRatio, setSpecialShape, undo,
                promptDownload, doDownload,
            };
        }
    }).mount('#app');
})();
</script>
</body>
</html>
