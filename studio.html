<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script>!function(){try{var d=JSON.parse(localStorage.getItem('todo_settings')||'{}'),t=d.theme||'light';if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.className='theme-'+t;var dk=['dark','forest','night','torii','purple','ferriswheel','starrynight'];document.documentElement.style.background=dk.indexOf(t)>=0?'#0d1117':'#f0f4ff';}catch(e){}}();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>琉璃工坊 — Studio</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">

    <link rel="stylesheet" href="./css/shared_theme.css">
    <link rel="stylesheet" href="./css/effects.css">
    <link rel="stylesheet" href="./css/lapis_shared_style.css">
    <link rel="stylesheet" href="./css/lapis_scroll.css">
    <link rel="stylesheet" href="./css/lapis_studio.css">

    <script src="./js/effects.js" defer></script>
    <script src="./js/storage.js" defer></script>
    <script src="./js/firebase_config.js" defer></script>
    <script type="module" src="./js/auth.js"></script>
    <script src="./js/core_engine.js" defer></script>
    <script src="./js/i18n.js" defer></script>
    <script src="./js/nav.js" defer></script>
    <script src="./js/lapis_core_ui.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js" defer></script>
    <script src="./js/fx/lapis_fx_shatter.js" defer></script>
    <script src="./js/fx/lapis_fx_jigsaw.js" defer></script>
    <script src="./js/fx/lapis_fx_collage.js" defer></script>
    <script src="./js/fx/lapis_fx_text.js" defer></script>
    <script src="./js/fx/lapis_fx_sticker.js" defer></script>
    <script src="./js/fx/lapis_fx_base.js" defer></script>
    <script src="./js/lapis_studio_jigsaw_manual.js" defer></script>
    <script src="./js/lapis_studio_ui.js" defer></script>
</head>
<body>
<div id="lapis-bg-system">
    <div id="bg-layer-a" class="lapis-bg-layer active"></div>
    <div id="bg-layer-b" class="lapis-bg-layer"></div>
</div>

<div id="app" v-cloak
     :class="[isDarkTheme ? 'theme-dark-mode' : 'theme-light-mode']"
     style="display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative;">

    <!-- ROW 1: LapisNav header injected by LapisNav.inject() -->

    <!-- ── Main content ───────────────────────────────────────────────────── -->
    <main class="relative z-10 flex-1 overflow-hidden flex flex-col"
          :style="{ paddingBottom: mainPaddingBottom }">

        <!-- A: Upload zone (no image) -->
        <div v-show="contentView === 'upload'"
             class="studio-drop-zone flex-1 flex flex-col items-center justify-center gap-6 m-4 rounded-[2.5rem]"
             :class="{ 'drag-over': dragOver }"
             @dragover.prevent="dragOver = true"
             @dragleave="dragOver = false"
             @drop.prevent="onDrop">
            <i data-lucide="image-plus" class="w-16 h-16 opacity-30"></i>
            <div class="text-center space-y-1">
                <p class="font-black text-lg opacity-70">{{ t.tapToUpload }}</p>
                <p class="text-xs opacity-40">{{ t.uploadHint }}</p>
            </div>
            <label class="px-8 py-4 bg-blue-600 text-white rounded-2xl font-black cursor-pointer active:scale-95 transition-transform select-none">
                {{ t.choosePhoto }}
                <input type="file" accept="image/*" class="hidden" @change="handleFileInput">
            </label>
        </div>

        <!-- B: Image area — shared by main nav preview AND effects nav -->
        <div v-show="contentView === 'preview'"
             class="flex-1 relative flex items-center justify-center p-4 overflow-hidden">
            <!-- Delete button — top-right, confirm dialog -->
            <button v-if="imageUrl"
                    @click="promptDeleteImage"
                    class="absolute top-2 right-2 z-10 w-9 h-9 rounded-full flex items-center justify-center text-white"
                    style="background:rgba(239,68,68,0.80);backdrop-filter:blur(4px);">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <img :src="resultUrl || imageUrl"
                 id="studio-preview-image"
                 class="max-w-full max-h-full object-contain rounded-2xl shadow-2xl"
                 style="pointer-events:none;user-select:none;">
            <div v-if="sandboxActive"
                 id="fx-sandbox-layer"
                 class="fx-sandbox-layer"
                 :class="{ 'is-dragging': sandboxDragging }"
                 @pointermove="moveSandbox"
                 @pointerup="endSandbox"
                 @pointercancel="endSandbox">
                <div class="fx-sandbox-box"
                     :style="sandboxBoxStyle"
                     @pointermove="moveSandbox"
                     @pointerup="endSandbox"
                     @pointerdown.stop="beginSandboxMove">
                    <div class="fx-rotate-handle"
                         @pointermove="moveSandbox"
                         @pointerup="endSandbox"
                         @pointerdown.stop="beginSandboxRotate"></div>
                    <div class="fx-scale-handle"
                         @pointermove="moveSandbox"
                         @pointerup="endSandbox"
                         @pointerdown.stop="beginSandboxScale"></div>
                </div>
            </div>
            <div v-if="jigsawRoiActive"
                 id="jigsaw-roi-layer"
                 class="jigsaw-roi-layer"
                 :class="{ 'is-dragging': jigsawRoiDragging }"
                 :style="jigsawRoiLayerStyle"
                 @pointermove="moveJigsawRoi"
                 @pointerup="endJigsawRoi"
                 @pointercancel="endJigsawRoi">
                <div class="jigsaw-roi-box"
                     :style="jigsawRoiStyle"
                     @pointerdown.stop="beginJigsawRoiMove">
                    <span class="jigsaw-roi-label">ROI</span>
                    <button type="button" class="jigsaw-roi-handle is-nw" @pointerdown.stop="beginJigsawRoiResize('nw', $event)"></button>
                    <button type="button" class="jigsaw-roi-handle is-ne" @pointerdown.stop="beginJigsawRoiResize('ne', $event)"></button>
                    <button type="button" class="jigsaw-roi-handle is-sw" @pointerdown.stop="beginJigsawRoiResize('sw', $event)"></button>
                    <button type="button" class="jigsaw-roi-handle is-se" @pointerdown.stop="beginJigsawRoiResize('se', $event)"></button>
                </div>
            </div>
            <div v-if="jigsawManualActive"
                 id="jigsaw-manual-layer"
                 class="jigsaw-manual-layer"
                 :class="{ 'is-dragging': jigsawDragging }"
                 :style="jigsawRoiLayerStyle"
                 @pointermove="moveJigsawPiece"
                 @pointerup="endJigsawPieceDrag"
                 @pointercancel="endJigsawPieceDrag">
                <button v-for="piece in jigsawLayout"
                        :key="piece.id"
                        type="button"
                        class="jigsaw-piece-hotspot"
                        :style="jigsawPieceStyle(piece)"
                        @pointerdown.stop="beginJigsawPieceDrag(piece, $event)">
                </button>
            </div>
        </div>

        <!-- C: Crop workspace (manual crop mode) -->
        <div v-show="contentView === 'crop'" class="flex-1 flex flex-col overflow-hidden min-h-0">
            <div id="crop-wrap" class="flex-1 overflow-hidden">
                <img id="crop-image" style="max-width:100%;display:block;">
                <!-- SVG shape overlay: dims area OUTSIDE the selected shape -->
                <div v-if="isSpecialShape && cropBoxData && containerSize.w"
                     style="position:absolute;inset:0;pointer-events:none;z-index:20;"
                     v-html="shapeOverlaySvg">
                </div>
            </div>
        </div>

        <!-- D: Pro-Collage workspace — 6-layout grid with per-cell tap-to-fill -->
        <div v-show="contentView === 'collage'"
             class="flex-1 flex flex-col overflow-hidden">
            <!-- Layout selector strip -->
            <div class="shrink-0 flex gap-2 px-3 py-2 overflow-x-auto"
                 style="scrollbar-width:none;">
                <button v-for="(lyt, key) in collageLayouts" :key="key"
                        @click="setCollageLayout(key)"
                        class="collage-layout-btn"
                        :class="{ 'is-active': collageLayout === key }">
                    {{ lyt.label }}
                </button>
            </div>
            <div class="shrink-0 grid grid-cols-2 gap-2 px-3 pb-2">
                <label class="collage-control">
                    <span>Zoom</span>
                    <input type="range" min="0" max="1" step="0.01"
                           v-model.number="fxIntensity"
                           @input="syncCollageScale">
                </label>
                <label class="collage-control">
                    <span>Gap {{ collageGap }}px</span>
                    <input type="range" min="0" max="5" step="1"
                           v-model.number="collageGap">
                </label>
            </div>
            <div class="flex-1 flex items-center justify-center p-3 overflow-hidden">
                <div class="duo-collage-preview"
                     :class="'layout-' + collageLayout">
                    <div v-for="(slot, ci) in collageSlots" :key="ci"
                         class="collage-cell duo-slot"
                         :class="{ 'is-active': activeCollageSlot === ci, 'is-fixed': slot.fixed }"
                         :style="collageSlotFrameStyle(slot, ci)"
                         @click="slot.sourceImage ? selectCollageSlot(ci) : triggerCellInput(ci)"
                         @dblclick="triggerCellInput(ci)"
                         @pointerdown="beginCollageSlotDrag(ci, $event)"
                         @pointermove="moveCollageSlot"
                         @pointerup="endCollageSlot"
                         @pointercancel="endCollageSlot">
                        <img v-if="slot.sourceImage" :src="slot.sourceImage"
                             :style="collageSlotStyle(slot)"
                             class="absolute inset-0 w-full h-full object-cover pointer-events-none">
                        <div v-else class="absolute inset-0 flex flex-col items-center justify-center gap-1">
                            <i data-lucide="plus-circle" class="w-7 h-7 opacity-35"></i>
                            <span class="text-xs opacity-35">{{ ci + 1 }}</span>
                        </div>
                        <button type="button"
                                class="collage-lock-btn"
                                @click.stop="toggleCollageFixed(ci)">
                            <i :data-lucide="slot.fixed ? 'lock' : 'unlock'" class="w-3 h-3"></i>
                        </button>
                        <button type="button"
                                class="collage-slot-move"
                                @pointerdown.stop="beginCollageSlotMove(ci, $event)"
                                @pointermove="moveCollageSlot"
                                @pointerup="endCollageSlot"
                                @pointercancel="endCollageSlot">
                            <i data-lucide="move" class="w-3 h-3"></i>
                        </button>
                        <button type="button"
                                class="collage-slot-resize"
                                @pointerdown.stop="beginCollageSlotResize(ci, $event)"
                                @pointermove="moveCollageSlot"
                                @pointerup="endCollageSlot"
                                @pointercancel="endCollageSlot">
                        </button>
                    </div>
                </div>
            </div>
            <!-- Build button -->
            <div class="shrink-0 flex justify-center pb-2">
                <button @click="buildCollage"
                        class="px-8 py-2.5 rounded-full bg-blue-600 text-white text-sm font-bold active:scale-95 transition-transform">
                    {{ t.buildGrid }}
                </button>
            </div>
        </div>

    </main>

    <!-- ── Crop floating panel (manual crop controls) ──────────────────────── -->
    <div v-show="showFloatingPanel"
         style="position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:0;right:0;z-index:7005;">
        <div class="glass overflow-x-auto no-scrollbar px-3 py-2 flex items-center gap-2"
             style="backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);"
             :style="glassStyle">
            <!-- Manual: ratio + special shapes -->
            <template>
                <div class="shrink-0 w-px h-5 mx-1 opacity-20"
                     :class="isDarkTheme ? 'bg-white' : 'bg-black'"></div>
                <button v-for="r in cropRatios" :key="r.key"
                        @click="setRatio(r)"
                        class="shape-btn shrink-0 px-4 py-2 rounded-full glass text-xs font-bold whitespace-nowrap transition-all"
                        :class="{ 'is-active': cropShape === r.key }"
                        :style="cropShape !== r.key ? glassStyle : {}">
                    {{ r.label }}
                </button>
                <div class="shrink-0 w-px h-5 mx-1 opacity-20"
                     :class="isDarkTheme ? 'bg-white' : 'bg-black'"></div>
                <button v-for="s in specialShapes" :key="s.key"
                        @click="setSpecialShape(s)"
                        class="shape-btn shrink-0 w-10 h-10 rounded-full glass flex items-center justify-center transition-all"
                        :class="{ 'is-active': cropShape === s.key }"
                        :style="cropShape !== s.key ? glassStyle : {}"
                        :title="t[s.key]"
                        v-html="s.svg">
                </button>
            </template>
        </div>
    </div>

    <!-- ── FX Drawer — 3-layer vertical panel (effects nav only) ────────────── -->
    <div v-if="activeNav === 'effects'"
         class="fx-drawer glass glass-panel" :style="glassStyle"
         style="backdrop-filter:blur(24px);">

        <!-- Layer 1: Intensity slider (always visible) -->
        <div class="fx-drawer-slider">
            <span class="fx-label">{{ t.intensity }}</span>
            <input type="range" min="0" max="1" step="0.01"
                   v-model.number="fxIntensity"
                   @input="onSliderInput">
            <span class="fx-intensity-pct">{{ Math.round(fxIntensity * 100) }}%</span>
        </div>

        <!-- Layer 2: Category content, slide-up on category switch -->
        <transition name="fx-slide" mode="out-in">
            <div :key="effectCategory" class="fx-drawer-content">

                <!-- Colour filters -->
                <template v-if="effectCategory === 'filters'">
                    <button v-for="eff in effectsList" :key="eff.key"
                            @click="applyEffectFilter(eff.key)"
                            class="fx-chip"
                            :class="{ 'is-active': activeEffect === eff.key }">
                        {{ t[eff.tKey] }}
                    </button>
                </template>

                <!-- Jigsaw -->
                <template v-else-if="effectCategory === 'jigsaw'">
                    <select v-model.number="jigsawGrid"
                            @change="onJigsawGridChange"
                            class="fx-select"
                            title="Pieces">
                        <option v-for="n in [3,4,5,6]" :key="n" :value="n">
                            {{ n }}x{{ n }}
                        </option>
                    </select>
                    <button v-for="v in jigsawVariants" :key="v.key"
                            @click="applyEffectFilter(v.key)"
                            class="fx-chip"
                            :class="{ 'is-active': activeEffect === v.key }">
                        {{ t[v.tKey] }}
                    </button>
                    <button type="button"
                            @click="toggleJigsawManual"
                            class="fx-chip"
                            :class="{ 'is-active': jigsawManual }">
                        Manual
                    </button>
                </template>

                <!-- Text overlay -->
                <template v-else-if="effectCategory === 'text'">
                    <input type="text"
                           v-model="textConfig.text"
                           :placeholder="t.enterText"
                           class="fx-text-input">
                    <select v-model="textConfig.fontFamily" class="fx-select">
                        <option value="Arial, sans-serif">Arial</option>
                        <option value="Georgia, serif">Georgia</option>
                        <option value="'Courier New', monospace">Courier</option>
                        <option value="Impact, fantasy">Impact</option>
                        <option value="KaiTi, 'DFKai-SB', serif">KaiTi</option>
                        <option value="PMingLiU, serif">PMingLiU</option>
                        <option value="'Death Note Font', fantasy">Death Note</option>
                        <option value="'Death Note Font 2', fantasy">Death Note 2</option>
                    </select>
                    <button type="button"
                            @click="textConfig.bold = !textConfig.bold"
                            class="fx-style-btn"
                            :class="{ 'is-active': textConfig.bold }"
                            title="Bold">
                        <i data-lucide="bold" class="w-4 h-4"></i>
                    </button>
                    <button type="button"
                            @click="textConfig.italic = !textConfig.italic"
                            class="fx-style-btn"
                            :class="{ 'is-active': textConfig.italic }"
                            title="Italic">
                        <i data-lucide="italic" class="w-4 h-4"></i>
                    </button>
                    <button type="button"
                            @click="textConfig.strike = !textConfig.strike"
                            class="fx-style-btn"
                            :class="{ 'is-active': textConfig.strike }"
                            title="Strikethrough">
                        <i data-lucide="strikethrough" class="w-4 h-4"></i>
                    </button>
                    <input type="color" v-model="textConfig.color"
                           class="fx-color-swatch" title="文字顏色">
                    <button @click="applyText"
                            class="fx-chip"
                            :class="{ 'is-active': activeEffect === '__text__' }">
                        {{ t.apply }}
                    </button>
                </template>

                <!-- Stickers -->
                <template v-else>
                    <button v-for="cat in stickerCategoryList" :key="cat.key"
                            @click="stickerCategory = cat.key"
                            class="fx-sticker-category"
                            :class="{ 'is-active': stickerCategory === cat.key }">
                        {{ cat.label }}
                    </button>
                    <button v-for="emoji in stickerList" :key="emoji"
                            @click="applySticker(emoji)"
                            class="fx-sticker-btn"
                            :class="{ 'is-active': stickerActive === emoji }">
                        {{ emoji }}
                    </button>
                </template>

            </div>
        </transition>

        <!-- Layer 3: Category tab bar -->
        <div class="fx-drawer-tabs">
            <button @click="effectCategory = 'filters'"
                    class="fx-tab" :class="{ 'is-active': effectCategory === 'filters' }">
                <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                <span>{{ t.filtersCat }}</span>
            </button>
            <button @click="effectCategory = 'jigsaw'"
                    class="fx-tab" :class="{ 'is-active': effectCategory === 'jigsaw' }">
                <i data-lucide="puzzle" class="w-4 h-4"></i>
                <span>{{ t.jigsawCat }}</span>
            </button>
            <button @click="effectCategory = 'text'"
                    class="fx-tab" :class="{ 'is-active': effectCategory === 'text' }">
                <i data-lucide="type" class="w-4 h-4"></i>
                <span>{{ t.textCat }}</span>
            </button>
            <button @click="effectCategory = 'stickers'"
                    class="fx-tab" :class="{ 'is-active': effectCategory === 'stickers' }">
                <i data-lucide="smile" class="w-4 h-4"></i>
                <span>{{ t.stickerCat }}</span>
            </button>
        </div>
    </div>

    <!-- ── Bottom Nav — drawer-swap transition between 3 states ─────────── -->
    <!-- @after-enter / @after-leave refresh Lucide icons inside the new nav -->
    <transition name="drawer-swap" mode="out-in"
                @after-enter="refreshIcons" @after-leave="refreshIcons">

        <!-- ── Main nav ─────────────────────────────────────────────────── -->
        <nav v-if="activeNav === 'main'" key="nav-main"
             class="bottom-nav glass" :style="glassStyle">
            <button @click="triggerUpload" class="nav-item" :class="{ active: !imageUrl }">
                <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                <span>{{ t.upload }}</span>
            </button>
            <button @click="enterCrop" class="nav-item"
                    :style="!imageUrl ? { opacity: 0.35, pointerEvents: 'none' } : {}">
                <i data-lucide="crop" class="w-5 h-5"></i>
                <span>{{ t.manualCrop }}</span>
            </button>
            <button @click="enterCollage" class="nav-item">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
                <span>{{ t.autoCollage }}</span>
            </button>
            <button @click="enterEffects" class="nav-item"
                    :style="!(imageUrl || resultUrl) ? { opacity: 0.35, pointerEvents: 'none' } : {}">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
                <span>{{ t.effects }}</span>
            </button>
            <!-- Download is the ONLY entry point for file export -->
            <button @click="promptDownload" class="nav-item"
                    :style="!imageUrl ? { opacity: 0.35, pointerEvents: 'none' } : {}">
                <i data-lucide="download" class="w-5 h-5"></i>
                <span>{{ t.save }}</span>
            </button>
        </nav>

        <!-- ── Effects action row ────────────────────────────────────────── -->
        <!-- Apply = commit preview, STAY in effects nav                     -->
        <!-- Save  = commit (if pending) + EXIT to main nav (no download)    -->
        <!-- Back  = DISCARD uncommitted preview + exit to main nav          -->
        <nav v-else-if="activeNav === 'effects'" key="nav-effects"
             class="bottom-nav glass" style="backdrop-filter:blur(24px);" :style="glassStyle">
            <button @click="exitEffects" class="nav-item">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                <span>{{ t.back }}</span>
            </button>
            <button @click="undo" class="nav-item" :disabled="canUndoCt === 0">
                <i data-lucide="undo-2" class="w-5 h-5"></i>
                <span>{{ t.undo }}</span>
            </button>
            <button @click="applyCurrentEffect" class="nav-item"
                    :class="{ active: activeEffect !== '' }"
                    :style="activeEffect === '' ? { opacity: 0.35, pointerEvents: 'none' } : {}">
                <i data-lucide="check" class="w-5 h-5"></i>
                <span>{{ t.apply }}</span>
            </button>
            <button @click="saveFromEffects" class="nav-item">
                <i data-lucide="save" class="w-5 h-5"></i>
                <span>{{ t.save }}</span>
            </button>
        </nav>

        <!-- ── Crop/Collage action row ──────────────────────────────────── -->
        <!-- Apply (manual) = commit crop + stay; Apply (collage) = no-op   -->
        <!-- Save  = commit + EXIT to main nav (no download)                -->
        <nav v-else key="nav-crop"
             class="bottom-nav glass" style="backdrop-filter:blur(24px);" :style="glassStyle">
            <button @click="exitCrop" class="nav-item">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                <span>{{ t.back }}</span>
            </button>
            <button @click="undo" class="nav-item" :disabled="canUndoCt === 0">
                <i data-lucide="undo-2" class="w-5 h-5"></i>
                <span>{{ t.undo }}</span>
            </button>
            <button @click="cropApply" class="nav-item"
                    :class="{ active: cropMode === 'manual' }"
                    :style="cropMode === 'collage' ? { opacity: 0.35, pointerEvents: 'none' } : {}">
                <i data-lucide="check" class="w-5 h-5"></i>
                <span>{{ t.apply }}</span>
            </button>
            <button @click="saveFromCrop" class="nav-item">
                <i data-lucide="save" class="w-5 h-5"></i>
                <span>{{ t.save }}</span>
            </button>
        </nav>

    </transition>

    <div id="studio-delete-modal"
         class="lapis-modal-backdrop centered studio-action-modal"
         style="display:none;">
        <div class="lapis-modal-shell glass-panel studio-confirm-shell">
            <div class="lapis-modal-header">
                <h3 class="lapis-modal-title">{{ t.deleteImage }}</h3>
                <button type="button" class="lapis-modal-close" @click="closeStudioModal('studio-delete-modal')">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="lapis-modal-body">
                <p class="studio-modal-message">{{ t.confirmDelete }}</p>
            </div>
            <div class="lapis-modal-footer">
                <button type="button" class="lapis-btn-secondary" @click="closeStudioModal('studio-delete-modal')">
                    {{ t.cancel }}
                </button>
                <button type="button" class="lapis-btn-primary studio-danger-btn" @click="confirmDeleteImage">
                    {{ t.confirm }}
                </button>
            </div>
        </div>
    </div>

    <div id="studio-download-modal"
         class="lapis-modal-backdrop centered studio-action-modal"
         style="display:none;">
        <div class="lapis-modal-shell glass-panel studio-confirm-shell">
            <div class="lapis-modal-header">
                <h3 class="lapis-modal-title">{{ t.saveAs }}</h3>
                <button type="button" class="lapis-modal-close" @click="closeStudioModal('studio-download-modal')">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="lapis-modal-body">
                <input id="studio-download-name"
                       v-model="downloadName"
                       type="text"
                       class="studio-modal-input"
                       inputmode="text"
                       autocomplete="off"
                       @keyup.enter="confirmDownloadImage">
            </div>
            <div class="lapis-modal-footer">
                <button type="button" class="lapis-btn-secondary" @click="closeStudioModal('studio-download-modal')">
                    {{ t.cancel }}
                </button>
                <button type="button" class="lapis-btn-primary" @click="confirmDownloadImage">
                    {{ t.confirm }}
                </button>
            </div>
        </div>
    </div>

    <div id="studio-message-modal"
         class="lapis-modal-backdrop centered studio-action-modal"
         style="display:none;">
        <div class="lapis-modal-shell glass-panel studio-confirm-shell">
            <div class="lapis-modal-header">
                <h3 class="lapis-modal-title">{{ modalMessageTitle }}</h3>
                <button type="button" class="lapis-modal-close" @click="closeStudioModal('studio-message-modal')">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="lapis-modal-body">
                <p class="studio-modal-message">{{ modalMessage }}</p>
            </div>
            <div class="lapis-modal-footer">
                <button type="button" class="lapis-btn-primary" @click="closeStudioModal('studio-message-modal')">
                    {{ t.confirm }}
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input id="studio-file-input"  type="file" accept="image/*" class="hidden" @change="handleFileInput">
    <input id="collage-cell-input" type="file" accept="image/*" class="hidden" @change="onCellFileInput">

</div>
</body>
</html>
