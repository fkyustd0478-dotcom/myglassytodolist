<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script>!function(){try{var d=JSON.parse(localStorage.getItem('todo_settings')||'{}'),t=d.theme||'light';if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.className='theme-'+t;var dk=['dark','forest','night','torii','purple','ferriswheel','starrynight'];document.documentElement.style.background=dk.indexOf(t)>=0?'#0d1117':'#f0f4ff';}catch(e){}}();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>琉璃語言 — Language</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="./css/shared_theme.css">
    <link rel="stylesheet" href="./css/effects.css">
    <link rel="stylesheet" href="./css/lapis_shared_style.css">
    <link rel="stylesheet" href="./css/lapis_scroll.css">

    <script src="./js/effects.js" defer></script>
    <script src="./js/storage.js" defer></script>
    <script src="./js/core_engine.js" defer></script>
    <script src="./js/i18n.js" defer></script>
    <script src="./js/nav.js" defer></script>
    <script src="./js/lapis_core_ui.js" defer></script>

    <style>
        [v-cloak] { display: none !important; }
        html  { background: #0d0d0d; }
        body  { opacity: 0; transition: opacity 0.4s ease-in-out; }
        body.lapis-ready { opacity: 1; }
    </style>
</head>
<body>
<div id="lapis-bg-system">
    <div id="bg-layer-a" class="lapis-bg-layer active"></div>
    <div id="bg-layer-b" class="lapis-bg-layer"></div>
</div>

<div id="app" v-cloak
     :class="[isDarkTheme ? 'theme-dark-mode' : 'theme-light-mode']"
     style="display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative;">

    <!-- Header (injected by LapisNav) -->

    <!-- Main Content -->
    <main class="relative z-10 flex-1 overflow-y-auto no-scrollbar px-6 py-4" style="padding-bottom:var(--nav-height)">

        <!-- Active Tab: Learn -->
        <div v-show="activeTab === 'learn'" class="flex flex-col items-center justify-center h-full gap-6">
            <div class="glass rounded-[2.5rem] p-10 flex flex-col items-center gap-4 max-w-sm w-full" :style="glassStyle">
                <i data-lucide="graduation-cap" class="w-12 h-12 opacity-40"></i>
                <h2 class="text-xl font-black tracking-tight">{{ t.learn }}</h2>
                <p class="text-sm opacity-40 text-center">{{ t.comingSoon }}</p>
            </div>
        </div>

        <!-- Active Tab: Vocabulary -->
        <div v-show="activeTab === 'vocab'" class="flex flex-col items-center justify-center h-full gap-6">
            <div class="glass rounded-[2.5rem] p-10 flex flex-col items-center gap-4 max-w-sm w-full" :style="glassStyle">
                <i data-lucide="library" class="w-12 h-12 opacity-40"></i>
                <h2 class="text-xl font-black tracking-tight">{{ t.vocab }}</h2>
                <p class="text-sm opacity-40 text-center">{{ t.comingSoon }}</p>
            </div>
        </div>

        <!-- Active Tab: Notes -->
        <div v-show="activeTab === 'notes'" class="flex flex-col items-center justify-center h-full gap-6">
            <div class="glass rounded-[2.5rem] p-10 flex flex-col items-center gap-4 max-w-sm w-full" :style="glassStyle">
                <i data-lucide="notebook-pen" class="w-12 h-12 opacity-40"></i>
                <h2 class="text-xl font-black tracking-tight">{{ t.notes }}</h2>
                <p class="text-sm opacity-40 text-center">{{ t.comingSoon }}</p>
            </div>
        </div>

        <!-- Active Tab: Achievements -->
        <div v-show="activeTab === 'achievements'" class="flex flex-col items-center justify-center h-full gap-6">
            <div class="glass rounded-[2.5rem] p-10 flex flex-col items-center gap-4 max-w-sm w-full" :style="glassStyle">
                <i data-lucide="trophy" class="w-12 h-12 opacity-40"></i>
                <h2 class="text-xl font-black tracking-tight">{{ t.achievements }}</h2>
                <p class="text-sm opacity-40 text-center">{{ t.comingSoon }}</p>
            </div>
        </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav glass" :style="glassStyle">
        <button @click="activeTab = 'learn'" class="nav-item" :class="{ active: activeTab === 'learn' }">
            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
            <span>{{ t.learn }}</span>
        </button>
        <button @click="activeTab = 'vocab'" class="nav-item" :class="{ active: activeTab === 'vocab' }">
            <i data-lucide="library" class="w-5 h-5"></i>
            <span>{{ t.vocab }}</span>
        </button>
        <button @click="activeTab = 'notes'" class="nav-item" :class="{ active: activeTab === 'notes' }">
            <i data-lucide="notebook-pen" class="w-5 h-5"></i>
            <span>{{ t.notes }}</span>
        </button>
        <button @click="activeTab = 'achievements'" class="nav-item" :class="{ active: activeTab === 'achievements' }">
            <i data-lucide="trophy" class="w-5 h-5"></i>
            <span>{{ t.achievements }}</span>
        </button>
    </nav>

</div>

<script defer>
(function waitForVue() {
    if (typeof Vue === 'undefined' || typeof useNav === 'undefined') {
        return setTimeout(waitForVue, 20);
    }
    const { createApp, ref, computed, onMounted } = Vue;
    createApp({
        setup() {
            const { navDropdownOpen, currentPageTitle, toggleNavDropdown,
                    navSettings, isDarkTheme, glassStyle, themeClasses,
                    customBgStyle, systemDark, resolvedTheme } = useNav();

            const activeTab = ref('learn');

            const translations = {
                zh: { learn: '學習', vocab: '單字庫', notes: '筆記', achievements: '成就', comingSoon: '即將推出' },
                en: { learn: 'Learn', vocab: 'Vocabulary', notes: 'Notes', achievements: 'Achievements', comingSoon: 'Coming Soon' },
            };
            if (typeof LapisI18n !== 'undefined') {
                LapisI18n.register('zh', { languagePage: translations.zh });
                LapisI18n.register('en', { languagePage: translations.en });
            }
            const languageTranslationKeys = Object.keys(translations.zh);
            const getLanguageTranslations = (lang) => {
                const fallback = translations[lang] || translations.zh;
                if (typeof LapisI18n === 'undefined') return fallback;

                return languageTranslationKeys.reduce((dict, key) => {
                    const i18nKey = `languagePage.${key}`;
                    const value = LapisI18n.t(i18nKey, null, lang);
                    dict[key] = value === i18nKey ? fallback[key] : value;
                    return dict;
                }, {});
            };
            const t = computed(() => getLanguageTranslations(navSettings.lang));

            onMounted(() => {
                if (typeof LapisNav !== 'undefined') LapisNav.inject({ bottom: false });
                if (window.lucide) lucide.createIcons();
            });

            return { navDropdownOpen, currentPageTitle, toggleNavDropdown,
                     navSettings, isDarkTheme, glassStyle, themeClasses,
                     customBgStyle, systemDark, resolvedTheme, activeTab, t };
        }
    }).mount('#app');
})();
</script>
</body>
</html>
