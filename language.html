<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script>!function(){try{var d=JSON.parse(localStorage.getItem('todo_settings')||'{}'),t=d.theme||'light';if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.className='theme-'+t;var dk=['dark','night','torii','purple','ferriswheel','starrynight','deepgray'];document.documentElement.style.background=dk.indexOf(t)>=0?'#0d1117':'#f0f4ff';}catch(e){}}();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>琉璃語言 Language</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <link rel="stylesheet" href="./css/shared_theme.css">
    <link rel="stylesheet" href="./css/effects.css">
    <link rel="stylesheet" href="./css/lapis_shared_style.css">
    <link rel="stylesheet" href="./css/lapis_scroll.css">

    <script src="./js/effects.js" defer></script>
    <script src="./js/storage.js" defer></script>
    <script src="./js/firebase_config.js" defer></script>
    <script type="module" src="./js/auth.js"></script>
    <script src="./js/core_engine.js" defer></script>
    <script src="./js/i18n.js" defer></script>
    <script src="./js/nav.js" defer></script>
    <script src="./js/lapis_core_ui.js" defer></script>
    <script src="./modules/language_data.js" defer></script>
    <script src="./modules/language_logic.js" defer></script>
    <script src="./modules/language_view.js" defer></script>

    <style>
        [v-cloak] { display: none !important; }
        html  { background: #0d0d0d; }
        body  { opacity: 0; transition: opacity 0.4s ease-in-out; }
        body.lapis-ready { opacity: 1; }
        .theme-light-mode .language-study-card.glass {
            background: #ffffff !important;
            color: #111827 !important;
            border-color: rgba(0,0,0,0.12) !important;
            backdrop-filter: blur(18px) saturate(1.1);
        }
        .theme-dark-mode .language-study-card.glass {
            background: #000000 !important;
            color: #ffffff !important;
            border-color: rgba(255,255,255,0.24) !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        .language-native-select {
            width: 100%;
            font: inherit;
            color: CanvasText;
            background: Canvas;
            border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .language-card-answer {
            display: inline-block;
            border-radius: 0.5rem;
            padding: 0 0.35rem;
            color: #fff;
            font-weight: 900;
        }
        .language-card-answer.is-correct { background: #16a34a; }
        .language-card-answer.is-revealed { background: #dc2626; }
    </style>
</head>
<body>
<div id="lapis-bg-system">
    <div id="bg-layer-a" class="lapis-bg-layer active"></div>
    <div id="bg-layer-b" class="lapis-bg-layer"></div>
</div>

<div id="app" v-cloak
     :class="[isDarkTheme ? 'theme-dark-mode' : 'theme-light-mode']"
     style="display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative;">

    <main class="relative z-10 flex-1 overflow-y-auto no-scrollbar px-4 py-4" style="padding-bottom:var(--nav-height)">
        <language-learning-view
            :active-tab="activeTab"
            :lang="navSettings.lang"
            :nav-settings="navSettings">
        </language-learning-view>
    </main>

    <nav class="bottom-nav glass" :style="glassStyle">
        <button @click="activeTab = 'learn'" class="nav-item" :class="{ active: activeTab === 'learn' }">
            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
            <span>{{ t.study }}</span>
        </button>
        <button @click="activeTab = 'vocab'" class="nav-item" :class="{ active: activeTab === 'vocab' }">
            <i data-lucide="library" class="w-5 h-5"></i>
            <span>{{ t.vocab }}</span>
        </button>
        <button @click="activeTab = 'notes'" class="nav-item" :class="{ active: activeTab === 'notes' }">
            <i data-lucide="notebook-pen" class="w-5 h-5"></i>
            <span>{{ t.notes }}</span>
        </button>
        <button @click="activeTab = 'achievements'" class="nav-item" :class="{ active: activeTab === 'achievements' }">
            <i data-lucide="trophy" class="w-5 h-5"></i>
            <span>{{ t.achievements }}</span>
        </button>
        <button @click="activeTab = 'settings'" class="nav-item" :class="{ active: activeTab === 'settings' }">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span>{{ t.settings }}</span>
        </button>
    </nav>

</div>

<script defer>
(function waitForVue() {
    if (typeof Vue === 'undefined' ||
        typeof useNav === 'undefined' ||
        typeof window.LapisLanguageData === 'undefined' ||
        typeof window.LapisLanguageLogic === 'undefined' ||
        typeof window.LanguageLearningView === 'undefined') {
        return setTimeout(waitForVue, 20);
    }
    const { createApp, ref, computed, onMounted, onUpdated } = Vue;
    createApp({
        components: { LanguageLearningView: window.LanguageLearningView },
        setup() {
            const { navDropdownOpen, currentPageTitle, toggleNavDropdown,
                    navSettings, isDarkTheme, glassStyle, themeClasses,
                    customBgStyle, systemDark, resolvedTheme } = useNav();

            const activeTab = ref('learn');
            const translations = {
                zh: {
                    study: '學習',
                    vocab: '單字庫',
                    notes: '筆記',
                    achievements: '成就',
                    settings: '設定',
                },
                en: {
                    study: 'Study',
                    vocab: 'Vocabulary',
                    notes: 'Notes',
                    achievements: 'Achievements',
                    settings: 'Settings',
                },
            };
            const t = computed(() => translations[navSettings.lang] || translations.zh);

            function refreshIcons() {
                if (window.lucide) lucide.createIcons();
            }

            onMounted(() => {
                if (typeof LapisNav !== 'undefined') LapisNav.inject({ bottom: false });
                refreshIcons();
            });
            onUpdated(refreshIcons);

            return { navDropdownOpen, currentPageTitle, toggleNavDropdown,
                     navSettings, isDarkTheme, glassStyle, themeClasses,
                     customBgStyle, systemDark, resolvedTheme, activeTab, t };
        }
    }).mount('#app');
})();
</script>
</body>
</html>
